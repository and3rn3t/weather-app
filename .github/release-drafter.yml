name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['fix', 'bugfix', 'bug']
  - title: '🔒 Security'
    labels: ['security']
  - title: '🧰 Maintenance'
    labels: ['chore', 'dependencies', 'ci']
  - title: '📝 Documentation'
    labels: ['documentation', 'docs']

version-resolver:
  major:
    labels: ['breaking']
  minor:
    labels: ['feature', 'enhancement']
  patch:
    labels: ['fix', 'bugfix', 'bug', 'chore', 'dependencies', 'security', 'docs']
  default: patch

# Label PRs from their conventional-commit title so the version resolver works
# even when nobody labels by hand. `documentation` is left to the path-based
# labeler (.github/labeler.yml), whose sync-labels would strip a title-based one.
autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\(.+\))?!:/'
      - '/^BREAKING CHANGE:/'
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?:/'
  - label: 'bug'
    title:
      - '/^fix(\(.+\))?:/'
  - label: 'chore'
    title:
      - '/^(chore|ci|build|refactor|style|test|perf)(\(.+\))?:/'

template: |
  ## What's Changed

  $CHANGES
