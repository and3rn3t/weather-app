# Andernet Weather - CI/CD Pipeline
# Runs on pull requests and pushes to main

name: Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'weather/**'
      - '.github/workflows/ci.yml'
      - '!weather/Documentation/**'
      - '!**.md'
  pull_request:
    branches: [main]
    paths:
      - 'weather/**'
      - '.github/workflows/ci.yml'
      - '!weather/Documentation/**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  PROJECT_NAME: weather
  SCHEME: weather

jobs:
  build:
    name: Build & Test (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test iPhone only; iPad runs on pushes to main and manual runs.
        # iPhone SE testing can be done in nightly builds.
        device: ${{ fromJSON(github.event_name == 'pull_request' && '["iPhone 16 Pro"]' || '["iPhone 16 Pro","iPad Pro 13-inch (M4)"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Create APIConfig.swift from template
        # APIConfig.swift is gitignored (it holds an API key); CI builds with the placeholder.
        run: cp weather/Sources/Services/APIConfig.swift.template weather/Sources/Services/APIConfig.swift

      - name: Start simulator boot
        # The first boot of a simulator on a fresh runner takes minutes and was sitting,
        # unlogged, at the start of the test step. Wait for CoreSimulator to enumerate devices
        # (xcodebuild gives up with "Unable to find a device" if it asks too early), then boot in
        # the background so it overlaps with the cache restore and the build.
        run: |
          UDID=""
          for _ in $(seq 1 12); do
            UDID=$(xcrun simctl list devices available -j | jq -r --arg n "${{ matrix.device }}" '[.devices[][] | select(.name==$n)][0].udid // empty')
            [ -n "$UDID" ] && break
            sleep 10
          done
          if [ -z "$UDID" ]; then
            echo "::warning::${{ matrix.device }} simulator is not listed"
            exit 0
          fi
          date +%s > "$RUNNER_TEMP/sim-boot-start"
          nohup bash -c "xcrun simctl boot '$UDID'; xcrun simctl bootstatus '$UDID' -b; date +%s > '$RUNNER_TEMP/sim-boot-end'" \
            > "$RUNNER_TEMP/sim-boot.log" 2>&1 &
          disown

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcbeautify
          key: ${{ runner.os }}-homebrew-xcbeautify
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build for Testing
        # Uses the UnitTests plan so the weatherUITests target is not compiled
        # (-skip-testing only skips running it, not building it).
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -testPlan UnitTests \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }}' \
            -configuration Debug \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Wait for simulator boot
        run: |
          if [ ! -f "$RUNNER_TEMP/sim-boot-start" ]; then exit 0; fi
          for _ in $(seq 1 120); do
            [ -f "$RUNNER_TEMP/sim-boot-end" ] && break
            sleep 5
          done
          START=$(cat "$RUNNER_TEMP/sim-boot-start")
          if [ -f "$RUNNER_TEMP/sim-boot-end" ]; then
            echo "Simulator boot took $(( $(cat "$RUNNER_TEMP/sim-boot-end") - START ))s"
            echo "Simulator boot: $(( $(cat "$RUNNER_TEMP/sim-boot-end") - START ))s (overlapped with build)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::simulator did not finish booting in 10 minutes"
            cat "$RUNNER_TEMP/sim-boot.log"
          fi

      - name: Run Tests
        run: |
          set -o pipefail  # without it a failing xcodebuild is masked by xcbeautify's exit status
          # Skipped: tests that depend on live network. Four of them cache mock data in
          # SharedDataManager and assert on it, but WeatherService() also fires a real Open-Meteo
          # refresh that overwrites the cache (63.1 / 63.4 observed vs the expected 65.0); two
          # others call Open-Meteo / Tomorrow.io directly and time out intermittently on CI.
          # They need a URLSession seam in WeatherService; until then they stay out of PR CI.
          xcodebuild test-without-building \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -testPlan UnitTests \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }}' \
            -only-test-configuration 'Default Configuration' \
            -skip-testing:'weatherTests/EndToEndWorkflowTests/coldStartWorkflow()' \
            -skip-testing:'weatherTests/EndToEndWorkflowTests/warmStartWithCache()' \
            -skip-testing:'weatherTests/IntegrationTestScenarios/fullDataFlowIntegration()' \
            -skip-testing:'weatherTests/IntegrationTestScenarios/persistenceAcrossAppLifecycle()' \
            -skip-testing:'weatherTests/IntegrationTestScenarios/weatherServiceAndCacheIntegration()' \
            -skip-testing:'weatherTests/WeatherServiceIntegrationTests/serviceInitializationWithCache()' \
            -skip-testing:'weatherTests/TomorrowIOApiTests/invalidURLThrowsError()' \
            -skip-testing:'weatherTests/WeatherServiceEnhancedTests/refreshWeather()' \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions

      - name: Collect simulator log
        # Diagnostic: the test host takes minutes to launch on CI but seconds locally.
        # Keep the app / test-daemon log so the cause can be read from the timestamps.
        if: always()
        continue-on-error: true
        run: |
          xcrun simctl spawn booted log show --last 30m --style compact \
            --predicate 'process == "weather" OR process == "testmanagerd" OR process == "xctest"' \
            > sim-process.log 2>&1 || true
          wc -l sim-process.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.device }}
          path: |
            TestResults.xcresult
            sim-process.log
          retention-days: 7

  build-release:
    name: Release Build & Size Analysis
    runs-on: macos-15
    needs: [build]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Create APIConfig.swift from template
        # APIConfig.swift is gitignored (it holds an API key); CI builds with the placeholder.
        run: cp weather/Sources/Services/APIConfig.swift.template weather/Sources/Services/APIConfig.swift

      - name: Wait for iOS simulators
        # CoreSimulator can take a while to enumerate devices on a fresh runner, and
        # xcodebuild gives up with "Unable to find a device" if it asks too early.
        run: |
          for _ in 1 2 3 4 5 6; do
            xcrun simctl list devices available | grep -q "iPhone 16 Pro" && exit 0
            sleep 10
          done
          echo "::warning::iPhone 16 Pro simulator is not listed"

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-release-${{ hashFiles('**/*.swift', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-release-

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcbeautify
          key: ${{ runner.os }}-homebrew-xcbeautify
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build Release
        run: |
          xcodebuild build \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Analyze Build Size
        id: build-size
        run: |
          # Get the build product path
          BUILD_DIR=$(xcodebuild -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -showBuildSettings \
            -configuration Release \
            | grep -m 1 "BUILT_PRODUCTS_DIR" \
            | awk '{print $3}')

          if [ -d "$BUILD_DIR/weather.app" ]; then
            SIZE=$(du -sh "$BUILD_DIR/weather.app" | awk '{print $1}')
            echo "📦 App Bundle Size: $SIZE"
            echo "size=$SIZE" >> $GITHUB_OUTPUT

            # Create size breakdown
            echo "### 📊 Build Size Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total App Bundle | $SIZE |" >> $GITHUB_STEP_SUMMARY

            # Show largest files
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Largest Files:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            du -h "$BUILD_DIR/weather.app" | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Performance Metrics
        run: |
          echo "### ⚡ Build Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully on macOS 15 with Xcode 26.2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** Release" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** iOS Simulator" >> $GITHUB_STEP_SUMMARY
