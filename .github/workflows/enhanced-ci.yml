# Enhanced CI: release build size analysis (main only).
#
# Build + unit tests live in ci.yml and coverage in coverage.yml. The old device
# matrix here duplicated them and could not run (wrong project directory, test
# plans that don't exist), so it was retired.

name: Enhanced CI

on:
  push:
    branches: [main]
    paths:
      - 'weather/**'
      - '.github/workflows/enhanced-ci.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled]
    paths:
      - 'weather/**'

concurrency:
  group: enhanced-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  XCODE_VERSION: '26.2'

jobs:
  # Conditional release build (only on main branch)
  release-build:
    name: Release Build Analysis
    runs-on: macos-15
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Create APIConfig.swift from template
        # APIConfig.swift is gitignored (it holds an API key); CI builds with the placeholder.
        run: cp weather/Sources/Services/APIConfig.swift.template weather/Sources/Services/APIConfig.swift

      - name: Wait for iOS simulators
        # CoreSimulator can take a while to enumerate devices on a fresh runner, and
        # xcodebuild gives up with "Unable to find a device" if it asks too early.
        run: |
          for _ in 1 2 3 4 5 6; do
            xcrun simctl list devices available | grep -q "iPhone 16 Pro" && exit 0
            sleep 10
          done
          echo "::warning::iPhone 16 Pro simulator is not listed"

      - name: Release Build Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ios-release-${{ hashFiles('weather/**/*.swift', '**/project.pbxproj') }}
          restore-keys: |
            ios-release-
            ios-build-

      - name: Build Release
        run: |
          xcodebuild build \
            -project weather.xcodeproj \
            -scheme weather \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Release \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/Weather-Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Analyze Binary Size
        run: |
          # Get binary size
          BINARY_PATH="$HOME/Library/Developer/Xcode/DerivedData/Weather-Release/Build/Products/Release-iphonesimulator/weather.app/weather"
          if [[ -f "$BINARY_PATH" ]]; then
            BINARY_SIZE=$(du -h "$BINARY_PATH" | cut -f1)
            APP_SIZE=$(du -h "$HOME/Library/Developer/Xcode/DerivedData/Weather-Release/Build/Products/Release-iphonesimulator/weather.app" | cut -f1)
            
            echo "### 📦 Release Build Analysis" >> $GITHUB_STEP_SUMMARY
            echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| Binary | $BINARY_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| App Bundle | $APP_SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

  # Final status check
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [release-build]
    if: always()
    timeout-minutes: 1

    steps:
      - name: Check Overall Status
        # release-build only runs on main, so "skipped" is a pass on pull requests.
        run: |
          result="${{ needs.release-build.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "Enhanced CI: release build $result"
          else
            echo "::error::Release build analysis $result"
            exit 1
          fi
