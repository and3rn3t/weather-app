# Quick Feedback Loop: change detection, lint and security checks only (no builds).
# Builds and tests live in ci.yml (iOS) and android.yml (Android).

name: Quick CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'weather/**'
      - 'android-app/**'
      - '.github/workflows/quick-ci.yml'

concurrency:
  group: quick-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use newer Xcode for faster builds
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  # Ultra-fast checks (1-2 minutes)
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ios-changed: ${{ steps.changes.outputs.ios }}
      android-changed: ${{ steps.changes.outputs.android }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ios:
              - 'weather/**'
            android:
              - 'android-app/**'

      - name: SwiftLint (Linux - 10x cheaper)
        if: steps.changes.outputs.ios == 'true'
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict --config .swiftlint.yml weather/

      - name: Android Lint
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Quick Lint
        if: steps.changes.outputs.android == 'true'
        working-directory: android-app
        run: |
          ./gradlew lintDebug --parallel --build-cache
        timeout-minutes: 10

  # Comprehensive feedback (only for important PRs)
  comprehensive-check:
    name: Full Validation
    needs: [quick-checks]
    if: |
      github.event.pull_request.changed_files > 50 ||
      contains(github.event.pull_request.labels.*.name, 'comprehensive-ci') ||
      contains(github.event.pull_request.title, '[full-ci]')
    uses: ./.github/workflows/ios-build-reusable.yml
    with:
      configuration: 'Debug'
      run_tests: true
      enable_coverage: false

  # Status reporting
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest  
    needs: [quick-checks]
    if: always()
    timeout-minutes: 1

    steps:
      - name: Report Status
        run: |
          if [[ "${{ needs.quick-checks.result }}" == "success" ]]; then
            echo "✅ Quick CI passed! Ready for review."
            echo "### ⚡ Quick CI Results" >> $GITHUB_STEP_SUMMARY  
            echo "- ✅ Code quality checks passed" >> $GITHUB_STEP_SUMMARY
            echo "- 🚀 PR is ready for review" >> $GITHUB_STEP_SUMMARY
            
            # Add helpful next steps
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
            echo "- Add \`comprehensive-ci\` label for full test suite" >> $GITHUB_STEP_SUMMARY
            echo "- Add \`[full-ci]\` to title for complete validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Quick CI failed. Check the logs above."
            echo "### ❌ Quick CI Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please fix the issues and push again." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi